# ============================================================================
# station.conf — CONFIGURACIÓN DE ESTA MAC (no es secreto, una por estación)
# Destino: /usr/local/airlink/station.conf
#
# OJO: STATION_ID tiene que ser DISTINTO en cada Mac (va en el CSV y en SQL).
# Formato: KEY="valor", sin comentarios al final de la línea.
# Se copia con:  sudo cp station.conf /usr/local/airlink/station.conf
# ============================================================================

# Nombre único de esta estación (ej. AIRLINK-M4-01, AIRLINK-M4-02…)
STATION_ID="AIRLINK-M4-01"

# Usuario de macOS que usa la estación (el que inicia sesión): en la Mac Mini nueva es airlinkbi
STATION_USER="airlinkbi"

# Operador por defecto si nadie inició sesión en la app (puede quedar vacío)
OPERATOR=""

# Carpeta de IPSW. Mac Mini con SSD externo: /Volumes/AirlinkSSD/IPSW
# Sin SSD externo: /usr/local/airlink/IPSW
IPSW_DIR="/Volumes/AirlinkSSD/IPSW"

# Fijar versión máxima de iOS (vacío = la más nueva firmada)
IPSW_MAX_VERSION=""

# El updater baja los IPSW de los modelos procesados en los últimos N días ("0" = solo a mano)
IPSW_AUTO_DAYS="30"

# Restores simultáneos máximos (el resto espera en cola)
MAX_PARALLEL_RESTORES="30"

# Actualizaciones de la app: "rc" en la estación de prueba, "stable" en el resto
UPDATE_CHANNEL="rc"

# Alerta en la app si en la última hora el % de FAIL supera este número
FAIL_ALERT_PCT="25"
FAIL_ALERT_MIN="8"

# Espejo de IPSW en la red (opcional). Una estación sirve: IPSW_MIRROR_SERVE="1".
# Las demás apuntan a ella: IPSW_MIRROR_URL="http://<nombre>.local:8770"
IPSW_MIRROR_SERVE="0"
IPSW_MIRROR_URL=""

# Find My: si no se pudo leer, "continue" (restaura igual) o "fail" (no restaura)
FMI_UNKNOWN_POLICY="continue"

# --- No hace falta tocar de acá para abajo ---
DOC_DIR="/usr/local/airlink/logs"
ASSETS_DIR="/usr/local/airlink/assets"
CFGUTIL="/usr/local/bin/cfgutil"
KILL_USB_AGENTS="auto"
DASH_BIND="127.0.0.1"
